      .dots { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #21262d; font-size: 12px; letter-spacing: 1px; }
      .val { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #e6edf3; font-size: 12px; }
      .val-green { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #3fb950; font-size: 12px; }
      
      .tech-key { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #c084fc; font-size: 12px; font-weight: 700; }
      .tech-dots { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #21262d; font-size: 12px; }
      .tech-val { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #e6edf3; font-size: 12px; }
      
      .sec-border { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #00e5ff; font-size: 12px; opacity: 0.4; }
      .sec-title { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #00e5ff; font-size: 12px; font-weight: 700; }
      
      .contact-key { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #f778ba; font-size: 12px; font-weight: 700; }
      .contact-dots { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #21262d; font-size: 12px; }
      .contact-val { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #58a6ff; font-size: 12px; }
      
      .stats-icon { fill: #58a6ff; }
      .stats-text { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #8b949e; font-size: 12px; }
      
      .vert-line { stroke: #00e5ff; stroke-width: 0.5; opacity: 0.1; }
      .horiz-line { stroke: #00e5ff; stroke-width: 0.5; opacity: 0.06; }
      
      @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes scan { 0% { transform: translateY(-530px); } 100% { transform: translateY(530px); } }
      .blink { animation: blink 1.2s step-end infinite; }
      .scanline { animation: scan 5s linear infinite; opacity: 0.025; }
